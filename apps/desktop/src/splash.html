<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OnePOS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(to bottom right, #f8fafc, #ffffff, #eef2ff);
    color: #0f172a;
    -webkit-user-select: none;
  }
  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.25rem;
    width: 320px;
  }
  .badge {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    background: #4f46e5;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 10px rgba(79, 70, 229, 0.25);
  }
  h1 {
    font-size: 1.25rem;
    font-weight: 600;
    text-align: center;
  }

  .steps {
    display: flex;
    flex-direction: column;
    gap: 0.625rem;
    width: 100%;
  }
  .step {
    display: flex;
    align-items: center;
    gap: 0.625rem;
    font-size: 0.875rem;
    color: #94a3b8;
  }
  .step.state-active,
  .step.state-done { color: #0f172a; }
  .step.state-error { color: #b91c1c; }

  .icon {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: white;
  }
  .icon.state-pending { border: 2px solid #cbd5e1; }
  .icon.state-active {
    border: 2px solid #e2e8f0;
    border-top-color: #4f46e5;
    animation: spin 0.8s linear infinite;
  }
  .icon.state-done { background: #16a34a; }
  .icon.state-error { background: #dc2626; }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  #detail {
    font-size: 0.8125rem;
    color: #64748b;
    text-align: center;
    min-height: 1rem;
    word-break: break-word;
  }
  #detail.error {
    color: #b91c1c;
    background: #fef2f2;
    border: 1px solid #fecaca;
    border-radius: 8px;
    padding: 0.625rem 0.75rem;
    text-align: left;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="badge">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l1-5h16l1 5M3 9v10a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V9M3 9h18M9 13a3 3 0 0 0 6 0" />
      </svg>
    </div>
    <h1>Starting OnePOS</h1>
    <div class="steps">
      <div class="step" data-step="database">
        <span class="icon state-pending"></span>
        <span class="text">Local database</span>
      </div>
      <div class="step" data-step="server">
        <span class="icon state-pending"></span>
        <span class="text">Server</span>
      </div>
      <div class="step" data-step="web">
        <span class="icon state-pending"></span>
        <span class="text">Web app</span>
      </div>
    </div>
    <div id="detail"></div>
  </div>
  <script>
    var steps = {};
    document.querySelectorAll(".step").forEach(function (el) {
      steps[el.dataset.step] = el;
    });

    function setStep(step, status) {
      var el = steps[step];
      if (!el) return;
      el.className = "step state-" + status;
      el.querySelector(".icon").className = "icon state-" + status;
    }

    if (window.onepos && window.onepos.onStartupStep) {
      window.onepos.onStartupStep(function (payload) {
        setStep(payload.step, payload.status);

        var detailEl = document.getElementById("detail");
        if (payload.status === "error") {
          detailEl.textContent =
            "Something went wrong starting " +
            steps[payload.step].querySelector(".text").textContent +
            ": " +
            (payload.detail || "Unknown error") +
            ". Close this window and try again — if it keeps happening, please report it.";
          detailEl.className = "error";
        } else if (payload.detail) {
          // e.g. "Retrying… (attempt 2 of 3)" — a step recovering from a
          // transient hiccup, not yet an error worth alarming over.
          detailEl.textContent = payload.detail;
          detailEl.className = "";
        } else {
          detailEl.textContent = "";
          detailEl.className = "";
        }
      });
    }
  </script>
</body>
</html>
